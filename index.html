<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Org Structure Studio</title>
<meta name="description" content="เครื่องมือออกแบบและจัดเก็บโครงสร้างองค์กรของกลุ่มบริษัท พร้อมเวอร์ชัน Active / Draft / Inactive และบันทึกผ่าน GitHub">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bai+Jamjuree:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+Thai:wght@400;500;600&family=Tinos:wght@400;700&family=Noto+Serif+Thai:wght@400;700&family=Carlito:wght@400;700&display=swap">
<style>
/* Layout: app shell — company bar on top; version rail | drafting canvas (blueprint dots) | inspector. */
:root{
  --bg:#f2f4f5; --surface:#ffffff; --surface-2:#eaeef0; --surface-3:#dbe2e5;
  --ink:#13202a; --ink-2:#3a4954; --muted:#66747e; --line:#d4dbdf; --line-strong:#a9b6bd;
  --accent:#0d6672; --accent-ink:#09505a; --on-accent:#ffffff; --accent-weak:#d7ebed;
  --copper:#a4561f; --copper-weak:#f6e7da; --plat:#3a59a8; --plat-weak:#e2e8f6; --partner:#7a5aa6; --partner-weak:#eee7f6;
  --ok:#1c7a47; --ok-weak:#dbefe2; --warn:#94600f; --warn-weak:#f7ebd2; --off:#69757e; --off-weak:#e5e9eb; --danger:#b03636; --danger-weak:#f6dfdf;
  --grid:rgba(19,32,42,.11); --scrim:rgba(10,18,24,.48);
  --shadow:0 1px 2px rgba(19,32,42,.06),0 10px 28px rgba(19,32,42,.10);
  --f-display:"Bai Jamjuree","IBM Plex Sans Thai","Noto Sans Thai",system-ui,sans-serif;
  --f-body:"IBM Plex Sans Thai","Noto Sans Thai","Leelawadee UI",Tahoma,system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  /* org chart sheet: same look as the Excel source, identical in light and dark mode */
  --paper:#ffffff; --paper-ink:#000000; --bevel:#bfbfbf;
  --f-doc:"Times New Roman",Tinos,Times,"Noto Serif Thai",Tahoma,serif;
  --f-legend:Calibri,Carlito,"IBM Plex Sans Thai",Arial,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0e1418; --surface:#151d22; --surface-2:#1c262c; --surface-3:#253239;
    --ink:#e2e9ed; --ink-2:#b8c4cb; --muted:#8796a0; --line:#28343b; --line-strong:#4a5b65;
    --accent:#4cb0ba; --accent-ink:#86d3da; --on-accent:#06191c; --accent-weak:#123940;
    --copper:#e19a62; --copper-weak:#3a2516; --plat:#90a8ec; --plat-weak:#1d2846; --partner:#bc9fe4; --partner-weak:#2c2340;
    --ok:#5ec98c; --ok-weak:#123222; --warn:#e5b45e; --warn-weak:#3a2b10; --off:#98a5ad; --off-weak:#222c32; --danger:#f08585; --danger-weak:#3e1d1d;
    --grid:rgba(226,233,237,.08); --scrim:rgba(0,0,0,.6);
    --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 28px rgba(0,0,0,.4);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0e1418; --surface:#151d22; --surface-2:#1c262c; --surface-3:#253239;
  --ink:#e2e9ed; --ink-2:#b8c4cb; --muted:#8796a0; --line:#28343b; --line-strong:#4a5b65;
  --accent:#4cb0ba; --accent-ink:#86d3da; --on-accent:#06191c; --accent-weak:#123940;
  --copper:#e19a62; --copper-weak:#3a2516; --plat:#90a8ec; --plat-weak:#1d2846; --partner:#bc9fe4; --partner-weak:#2c2340;
  --ok:#5ec98c; --ok-weak:#123222; --warn:#e5b45e; --warn-weak:#3a2b10; --off:#98a5ad; --off-weak:#222c32; --danger:#f08585; --danger-weak:#3e1d1d;
  --grid:rgba(226,233,237,.08); --scrim:rgba(0,0,0,.6);
  --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 28px rgba(0,0,0,.4);
  color-scheme:dark;
}

*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.55 var(--f-body);-webkit-font-smoothing:antialiased;overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--accent-ink)}
h1,h2,h3{text-wrap:balance}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
kbd{font-family:var(--f-mono);font-size:11px;border:1px solid var(--line-strong);border-bottom-width:2px;border-radius:4px;padding:0 4px;background:var(--surface)}
svg{flex:none}
.app{height:100%;display:flex;flex-direction:column}

/* ---------- buttons ---------- */
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line-strong);background:var(--surface);border-radius:7px;padding:6px 12px;font-size:13px;font-weight:500;line-height:1.35;cursor:pointer;white-space:nowrap;text-decoration:none;color:var(--ink)}
.btn:hover{background:var(--surface-2)}
.btn svg{width:16px;height:16px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.primary:hover{background:var(--accent-ink);border-color:var(--accent-ink)}
.btn.danger{color:var(--danger);border-color:var(--danger)}
.btn.danger:hover{background:var(--danger-weak)}
.btn.ghost{border-color:transparent;background:none}
.btn.ghost:hover{background:var(--surface-2)}
.btn.sm{padding:3px 9px;font-size:12.5px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.primary:disabled{background:var(--accent);border-color:var(--accent)}
.ibtn{width:32px;height:32px;display:inline-grid;place-items:center;border:1px solid transparent;background:none;border-radius:7px;cursor:pointer;color:var(--ink-2);padding:0}
.ibtn:hover{background:var(--surface-2);border-color:var(--line)}
.ibtn svg{width:17px;height:17px}
.ibtn:disabled{opacity:.35;cursor:not-allowed}

/* ---------- top bar ---------- */
.top{display:flex;align-items:center;gap:14px;padding-block:8px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));background:var(--surface);border-bottom:1px solid var(--line);flex-wrap:wrap;position:relative;z-index:30}
.brand{display:flex;align-items:center;gap:9px;font:700 16px/1 var(--f-display);color:var(--ink);text-decoration:none;white-space:nowrap}
.brand svg{width:28px;height:28px}
.brand small{display:block;font:500 10.5px/1.2 var(--f-body);color:var(--muted);letter-spacing:.06em;text-transform:uppercase;margin-top:3px}
.cos{display:flex;gap:2px;overflow-x:auto;flex:1 1 320px;min-width:0;scrollbar-width:none;padding:2px}
.cos::-webkit-scrollbar{display:none}
.co-tab{position:relative;border:0;background:none;border-radius:6px;padding:6px 11px;font:500 13px/1.2 var(--f-mono);cursor:pointer;white-space:nowrap;color:var(--ink-2)}
.co-tab.home-tab{font-family:var(--f-body)}
.co-tab:hover{background:var(--surface-2);color:var(--ink)}
.co-tab[aria-current="true"]{background:var(--ink);color:var(--bg)}
.co-tab i{position:absolute;top:4px;right:3px;width:6px;height:6px;border-radius:50%;background:var(--warn)}
.top-r{display:flex;align-items:center;gap:8px;margin-left:auto}
.sync{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);white-space:nowrap}
.sync i{width:8px;height:8px;border-radius:50%;background:var(--off)}
.sync.warn i{background:var(--warn)} .sync.ok i{background:var(--ok)}
.sync.warn{color:var(--warn)}
.userchip{display:inline-flex;align-items:center;gap:7px;padding:3px 10px 3px 3px;border:1px solid var(--line);border-radius:999px;font-size:12.5px;cursor:pointer}
.userchip img,.userchip .av{width:24px;height:24px;border-radius:50%;background:var(--surface-3);display:grid;place-items:center;font-size:11px;font-weight:600}

/* dropdowns */
details.dd{position:relative}
details.dd>summary{list-style:none;cursor:pointer}
details.dd>summary::-webkit-details-marker{display:none}
.dd-menu{position:absolute;top:calc(100% + 6px);left:0;min-width:220px;background:var(--surface);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow);padding:6px;display:grid;gap:1px;z-index:40}
.dd-menu.right{left:auto;right:0}
.dd-menu button{display:flex;align-items:center;gap:9px;text-align:left;border:0;background:none;padding:7px 10px;border-radius:6px;font-size:13px;cursor:pointer;color:var(--ink);white-space:nowrap}
.dd-menu button:hover{background:var(--surface-2)}
.dd-menu button svg{width:16px;height:16px;color:var(--muted)}
.dd-menu hr{border:0;border-top:1px solid var(--line);margin:4px 2px}
.dd-info{padding:8px 10px;font-size:12.5px;color:var(--muted);line-height:1.5}
.dd-info b{color:var(--ink)}

/* banner */
.banner{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding-block:8px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));font-size:13px;border-bottom:1px solid var(--line);background:var(--accent-weak);color:var(--ink)}
.banner.warn{background:var(--warn-weak)}
.banner svg{width:16px;height:16px;color:var(--accent-ink)}
.banner.warn svg{color:var(--warn)}
.banner .sp{flex:1 1 auto}
.banner p{margin:0;min-width:0;flex:1 1 300px}

/* ---------- home ---------- */
.home{flex:1;overflow:auto}
.home-in{max-width:1240px;margin:0 auto;padding-block:28px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:grid;gap:24px}
.home-h{display:flex;flex-wrap:wrap;gap:20px 40px;align-items:end;justify-content:space-between}
.eyebrow{margin:0 0 6px;font-size:11.5px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--accent-ink)}
.home-h h1{font:600 30px/1.2 var(--f-display);margin:0}
.home-h .lede{margin:6px 0 0;color:var(--muted);max-width:60ch}
.kpis{display:flex;gap:28px;margin:0;flex-wrap:wrap}
.kpis div{display:grid;gap:2px}
.kpis dt{font-size:12px;color:var(--muted);order:2}
.kpis dd{margin:0;font:600 26px/1 var(--f-display);font-variant-numeric:tabular-nums;order:1}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:14px}
.co-card{display:grid;grid-template-rows:auto auto 1fr auto;gap:10px;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:16px;cursor:pointer;color:var(--ink);min-width:0}
.co-card:hover{border-color:var(--accent);box-shadow:var(--shadow)}
.cc-top{display:flex;align-items:center;justify-content:space-between;gap:8px}
.cc-code{font:700 22px/1 var(--f-display);letter-spacing:.02em}
.cc-name{font-size:13px;color:var(--muted);min-height:1.5em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.thumb{width:100%;height:96px;display:block;background:var(--paper);border-radius:8px;border:1px solid var(--line)}
.thumb .tl path{fill:none;stroke-width:1;vector-effect:non-scaling-stroke}
.thumb rect{stroke-width:1;vector-effect:non-scaling-stroke}
.cc-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:0}
.cc-stats div{display:grid}
.cc-stats dt{font-size:11.5px;color:var(--muted);order:2}
.cc-stats dd{margin:0;font:600 17px/1.2 var(--f-display);font-variant-numeric:tabular-nums;order:1}
.cc-foot{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:12px;color:var(--muted);border-top:1px solid var(--line);padding-top:10px}

/* pills */
.pill{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:1px 8px;font-size:11.5px;font-weight:600;line-height:1.6;white-space:nowrap}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.pill.active{background:var(--ok-weak);color:var(--ok)}
.pill.draft{background:var(--warn-weak);color:var(--warn)}
.pill.inactive{background:var(--off-weak);color:var(--off)}
.pill.model{background:var(--surface-2);color:var(--ink-2)}
.pill.model::before{display:none}
.tag{font-size:10.5px;font-weight:600;letter-spacing:.04em;border:1px solid var(--line-strong);color:var(--muted);border-radius:4px;padding:0 5px;white-space:nowrap}

/* ---------- workspace ---------- */
.ws{--rail-w:268px;--insp-w:330px;flex:1;min-height:0;display:grid;grid-template-columns:var(--rail-w) minmax(0,1fr) var(--insp-w);position:relative}
.ws-scrim{display:none}
.rail{border-right:1px solid var(--line);background:var(--surface);overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:20px;min-height:0}
.rail h3{font:600 11px/1.2 var(--f-body);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:0 0 8px;display:flex;align-items:center;justify-content:space-between;gap:8px;min-height:24px}
.rail section{display:grid;gap:6px}
.rail .empty{font-size:12.5px;color:var(--muted);margin:0;padding:8px 10px;border:1px dashed var(--line);border-radius:8px}
.rail-co{display:grid;gap:2px;padding-bottom:14px;border-bottom:1px solid var(--line)}
.rc-code{font:700 26px/1.1 var(--f-display)}
.rc-name{font-size:13px;color:var(--ink-2)}
.rc-name.none{color:var(--muted);font-style:italic}
.rc-en{font-size:12px;color:var(--muted)}
.vcard{display:grid;gap:3px;text-align:left;width:100%;border:1px solid var(--line);background:var(--surface);border-radius:9px;padding:9px 11px;cursor:pointer;color:var(--ink)}
.vcard:hover{border-color:var(--line-strong);background:var(--bg)}
.vcard[aria-current="true"]{border-color:var(--accent);background:var(--accent-weak)}
.vc-top{display:flex;align-items:center;justify-content:space-between;gap:8px}
.vno{font-size:11.5px;color:var(--muted)}
.vname{font-weight:600;font-size:13.5px;line-height:1.35}
.vmeta{font-size:12px;color:var(--muted)}

.main{display:flex;flex-direction:column;min-width:0;min-height:0}
.vhead{padding:12px 16px;border-bottom:1px solid var(--line);background:var(--surface);display:flex;flex-wrap:wrap;gap:10px 20px;align-items:center;justify-content:space-between}
.vh-l{display:grid;gap:3px;min-width:0}
.vh-meta{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:12.5px;color:var(--muted)}
.vtitle{font:600 19px/1.25 var(--f-display);margin:0}
.vh-stats{display:flex;gap:4px 14px;flex-wrap:wrap;font-size:12.5px;color:var(--muted)}
.vh-stats b{color:var(--ink);font-weight:600;font-variant-numeric:tabular-nums}
.vh-r{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.cmp{display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--muted)}
.lockhint{display:inline-flex;align-items:center;gap:5px;font-size:12.5px;color:var(--muted)}
.lockhint svg{width:14px;height:14px}

.tools{display:flex;align-items:center;gap:2px;padding:6px 10px;border-bottom:1px solid var(--line);background:var(--surface);flex-wrap:wrap;min-height:46px}
.tabs{display:inline-flex;background:var(--surface-2);border-radius:8px;padding:2px;margin-right:6px}
.tab{border:0;background:none;padding:5px 13px;border-radius:6px;font-size:13px;cursor:pointer;color:var(--ink-2)}
.tab[aria-selected="true"]{background:var(--surface);color:var(--ink);font-weight:500;box-shadow:0 1px 2px rgba(0,0,0,.1)}
.tbtn{display:inline-flex;align-items:center;gap:5px;border:1px solid transparent;background:none;border-radius:7px;padding:5px 8px;font-size:12.5px;cursor:pointer;color:var(--ink-2);white-space:nowrap}
.tbtn:hover{background:var(--surface-2);color:var(--ink)}
.tbtn svg{width:17px;height:17px}
.tbtn:disabled{opacity:.35;cursor:not-allowed;background:none}
.tbtn.danger:not(:disabled):hover{color:var(--danger);background:var(--danger-weak)}
.tbtn .tl:empty{display:none}
.sep{width:1px;height:20px;background:var(--line);margin:0 4px}
.tools-r{display:flex;align-items:center;gap:4px;margin-left:auto}
.m-only{display:none}
.tbtn.pt[aria-pressed="false"]{color:var(--muted)}
.tbtn.pt[aria-pressed="false"] svg{opacity:.7}
.inp{width:100%;border:1px solid var(--line-strong);background:var(--surface);border-radius:7px;padding:7px 9px;font-size:13.5px;min-width:0;color:var(--ink)}
.inp:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 3px var(--accent-weak)}
.inp:disabled{background:var(--surface-2);color:var(--muted)}
.inp.sm{padding:4px 8px;font-size:12.5px;width:auto}
textarea.inp{min-height:84px;resize:vertical;line-height:1.5}
.mono-in{font-family:var(--f-mono);font-size:12.5px}

.body{flex:1;min-height:0;display:flex;flex-direction:column;position:relative}
.canvas{position:relative;flex:1;min-height:0;overflow:hidden;background:var(--paper);cursor:grab;touch-action:none;outline:none}
.canvas.panning{cursor:grabbing}
.stage{position:absolute;left:0;top:0;transform-origin:0 0;background:var(--paper);color:var(--paper-ink)}
.links{position:absolute;left:0;top:0;overflow:visible;pointer-events:none}
.lk{fill:none;stroke-width:1.25}
.lk.dash{stroke-dasharray:6 4}
.lk.dot{stroke-dasharray:2 3}

/* unit boxes: colours, weight and alignment come from each unit's style (taken from the Excel charts) */
.node{position:absolute;width:200px;height:88px;padding:5px 8px;display:flex;flex-direction:column;justify-content:safe center;cursor:pointer;user-select:none;-webkit-user-select:none;font-family:var(--f-doc);line-height:1.17;overflow:visible}
.node:hover{box-shadow:0 0 0 2px rgba(13,102,114,.35)}
.node.sel{outline:2.5px solid var(--accent);outline-offset:3px;z-index:2}
.node.dragging{opacity:.35}
.node.drop{outline:2.5px dashed var(--accent);outline-offset:4px}
.x-txt{display:flex;flex-direction:column;gap:2px;max-height:100%;overflow:hidden;min-width:0}
.x-name,.x-en{overflow-wrap:anywhere}
.x-sub{font-size:.86em;font-weight:400;opacity:.85}
.x-pill{position:absolute;right:4px;bottom:3px;font:400 10px/1 var(--f-mono);color:#555;background:rgba(255,255,255,.85);padding:1px 3px}
.n-tog{position:absolute;left:50%;bottom:-11px;transform:translateX(-50%);min-width:24px;height:20px;padding:0 6px;border-radius:999px;border:1px solid #9aa5ab;background:#fff;color:#33424c;font:500 11px/1 var(--f-mono);cursor:pointer;display:grid;place-items:center}
.n-tog:hover{border-color:var(--accent);color:var(--accent-ink)}
.n-add{position:absolute;right:-11px;bottom:-11px;width:24px;height:24px;border-radius:50%;border:0;background:var(--accent);color:var(--on-accent);display:none;place-items:center;cursor:pointer;padding:0;box-shadow:var(--shadow)}
.n-add svg{width:14px;height:14px}
.node.sel .n-add{display:grid}
/* free layout: boxes keep their own position and size; handles on the selected box resize it */
.stage.free .node{padding:2px 5px;line-height:1.08}
.stage.free.editable .node{cursor:move}
.stage.free .n-add{display:none!important}
.stage.free .n-tog{left:18px;transform:none}
.stage.free.editable [data-fr]{cursor:move}
.rh{position:absolute;width:calc(10px * var(--hz,1));height:calc(10px * var(--hz,1));margin:calc(-5px * var(--hz,1));background:#fff;border:calc(1.5px * var(--hz,1)) solid var(--accent);display:none;z-index:4}
.node.sel .rh{display:block}
.rh-nw{left:0;top:0;cursor:nwse-resize} .rh-n{left:50%;top:0;cursor:ns-resize} .rh-ne{left:100%;top:0;cursor:nesw-resize} .rh-e{left:100%;top:50%;cursor:ew-resize}
.rh-se{left:100%;top:100%;cursor:nwse-resize} .rh-s{left:50%;top:100%;cursor:ns-resize} .rh-sw{left:0;top:100%;cursor:nesw-resize} .rh-w{left:0;top:50%;cursor:ew-resize}
.row4{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.row4 label{display:grid;gap:2px;font-size:11.5px;color:var(--muted)}
.row4 input{width:100%;min-width:0;border:1px solid var(--line-strong);border-radius:6px;padding:5px 6px;font:400 12.5px var(--f-mono);background:var(--surface);color:var(--ink)}
.n-badge{position:absolute;top:-10px;right:8px;font:600 10.5px/1.5 var(--f-body);padding:1px 7px;border-radius:5px;color:#fff}
.b-added{background:#1c7a47} .b-moved{background:#3a59a8} .b-renamed,.b-changed{background:#94600f}
.node.d-added{box-shadow:0 0 0 4px rgba(28,122,71,.35)} .node.d-moved{box-shadow:0 0 0 4px rgba(58,89,168,.35)} .node.d-renamed,.node.d-changed{box-shadow:0 0 0 4px rgba(148,96,15,.35)}

/* sheet frame copied from the Excel layout: bevelled title banner, abbreviation legend, footer table */
.sh-foot.abs{display:block;border:0;background:none}
.sh-foot.abs .sh-cell{position:absolute;border:1px solid #000;background:#fff}
.sh-title{position:absolute;background:#fff;border:1px solid #000;box-shadow:inset -11px -11px 0 var(--bevel)}
.sh-face{position:absolute;inset:10px 11px 11px 10px;border:1px solid #000;background:#fff;display:flex;flex-direction:column;justify-content:center;align-items:center;font-family:var(--f-doc);font-weight:700;line-height:1.2;text-align:center;padding:0 16px}
.sh-legend{position:absolute;border:1px solid #000;background:#fff;padding:10px 12px;font-family:var(--f-legend);line-height:1.4;color:#000;white-space:pre}
.sh-foot{position:absolute;display:grid;border:1px solid #000;background:#fff}
.sh-cell{border-left:1px solid #000;padding:10px 8px;font-family:var(--f-doc);line-height:1.35;color:#000;text-align:center;display:flex;flex-direction:column;justify-content:center;gap:4px;min-width:0}
.sh-cell:first-child{border-left:0}
.sh-rule{display:block;border-bottom:1px solid #000;margin:10px 12% 0}

/* node type tones (structure encoded by fill weight) */
.tc-board{--tc:var(--ink)} .tc-committee{--tc:var(--ink-2)} .tc-executive{--tc:var(--accent)} .tc-line{--tc:var(--accent)} .tc-office{--tc:var(--accent-ink)}
.tc-platform{--tc:var(--plat)} .tc-division{--tc:var(--ink-2)} .tc-department{--tc:var(--muted)} .tc-section{--tc:var(--line-strong)} .tc-team{--tc:var(--ok)}
.tc-position{--tc:var(--muted)} .tc-ai{--tc:var(--copper)} .tc-partner{--tc:var(--partner)} .tc-company{--tc:var(--ink)}
.n-hl{width:8px;height:8px;border-radius:50%;background:#FF0000;flex:none;display:inline-block}
.dot{width:9px;height:9px;border-radius:3px;background:var(--tc);flex:none;display:inline-block}

.rename{position:absolute;width:200px;height:88px;z-index:5;border:2px solid var(--accent);padding:8px;font:700 13.5px/1.25 var(--f-doc);background:#fff;color:#000;resize:none;outline:none;box-shadow:var(--shadow)}
.drag-ghost{position:fixed;left:0;top:0;pointer-events:none;z-index:200;opacity:.9;box-shadow:var(--shadow);transform-origin:0 0}

.zoomctl{position:absolute;right:max(12px,env(safe-area-inset-right,0px));bottom:max(12px,env(safe-area-inset-bottom,0px));display:flex;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:9px;box-shadow:var(--shadow);padding:2px}
.zoomctl .zv{font:500 12px/1 var(--f-mono);min-width:48px;text-align:center;border:0;background:none;cursor:pointer;color:var(--ink-2);padding:8px 2px}

/* outline */
.outline{flex:1;overflow:auto;background:var(--surface)}
.ol-wrap{min-width:0}
.ol-tip{padding:10px 16px;font-size:12.5px;color:var(--muted);border-bottom:1px solid var(--line);background:var(--bg)}
.ol-row{display:grid;grid-template-columns:minmax(240px,2.4fr) 150px minmax(150px,1.4fr) 70px 196px;gap:8px;align-items:center;padding:3px 16px;border-bottom:1px solid var(--line);min-width:860px}
.ol-row.ol-head{position:sticky;top:0;z-index:2;background:var(--surface);font-size:11.5px;font-weight:600;letter-spacing:.05em;color:var(--muted);text-transform:uppercase;padding-block:8px}
.ol-row.sel{background:var(--accent-weak)}
.ol-name{display:flex;align-items:center;gap:8px;padding-left:calc(var(--d) * 22px);min-width:0}
.ol-name .ol-txt{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ol-in,.ol-in2,.ol-num,.ol-sel{border:1px solid transparent;background:transparent;border-radius:6px;padding:5px 7px;min-width:0;width:100%;font-size:13.5px;color:var(--ink)}
.ol-in{font-weight:500}
.ol-in:hover,.ol-in2:hover,.ol-num:hover,.ol-sel:hover{border-color:var(--line)}
.ol-in:focus,.ol-in2:focus,.ol-num:focus,.ol-sel:focus{border-color:var(--accent);background:var(--surface);outline:none}
.ol-num,.num{text-align:right;font-family:var(--f-mono);font-size:12.5px;font-variant-numeric:tabular-nums}
.ol-act{display:flex;gap:0;justify-content:flex-end}
.ol-act .ibtn{width:30px;height:30px}
.ol-row:not(:hover):not(.sel) .ol-act .ibtn{opacity:.35}
.ol-type,.ol-headc{font-size:13px;color:var(--ink-2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* inspector */
.insp{border-left:1px solid var(--line);background:var(--surface);overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:18px;min-height:0}
.insp h3{font:600 11px/1.2 var(--f-body);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:0}
.ip-head{display:flex;align-items:start;justify-content:space-between;gap:10px}
.ip-head h2{font:600 17px/1.3 var(--f-display);margin:2px 0 0}
.panel{display:grid;gap:12px}
.field{display:grid;gap:4px;min-width:0}
.field>span{font-size:12px;color:var(--muted);font-weight:500}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.check,.radio{display:flex;gap:8px;align-items:flex-start;font-size:13px;cursor:pointer}
.check input,.radio input{margin-top:4px;accent-color:var(--accent)}
.check small{display:block;color:var(--muted);font-size:12px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:13px;margin:0}
.kv dt{color:var(--muted)} .kv dd{margin:0;min-width:0;overflow-wrap:anywhere}
.statgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.stat{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px 9px;display:grid}
.stat b{font:600 19px/1.15 var(--f-display);font-variant-numeric:tabular-nums}
.stat span{font-size:11.5px;color:var(--muted);line-height:1.3}
.typelist{display:grid;gap:4px;font-size:13px}
.typelist div{display:flex;align-items:center;gap:8px}
.typelist .num{margin-left:auto}
.steps{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.step{border:0;border-top:3px solid var(--line);background:none;padding:7px 0 0;text-align:left;font-size:12px;color:var(--muted);line-height:1.35;cursor:default}
.step b{display:block;font-size:12.5px;color:var(--ink-2)}
.step.done{border-top-color:var(--accent-weak)}
.step.on{border-top-color:var(--accent)}
.step.on b{color:var(--accent-ink)}
.step.can{cursor:pointer}
.step.can:hover b{color:var(--accent-ink)}
.btnrow{display:flex;flex-wrap:wrap;gap:6px}
.tip{font-size:12.5px;color:var(--muted);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:10px 12px;display:grid;gap:4px}
.tip b{color:var(--ink-2)}
.note{white-space:pre-wrap;font-size:13px;margin:0;color:var(--ink-2)}
.dsum{display:flex;flex-wrap:wrap;gap:6px}
.dchip{font-size:12px;font-weight:600;border-radius:6px;padding:2px 8px;font-variant-numeric:tabular-nums}
.dchip.added{background:var(--ok-weak);color:var(--ok)} .dchip.removed{background:var(--danger-weak);color:var(--danger)}
.dchip.moved{background:var(--plat-weak);color:var(--plat)} .dchip.renamed,.dchip.changed{background:var(--warn-weak);color:var(--warn)}
.dlist{display:grid;gap:2px;max-height:300px;overflow:auto;border:1px solid var(--line);border-radius:8px;padding:4px}
.dl-item{display:grid;grid-template-columns:auto 1fr;gap:2px 8px;text-align:left;border:0;background:none;padding:6px 8px;border-radius:6px;cursor:pointer;color:var(--ink);font-size:13px;align-items:center}
.dl-item:hover{background:var(--surface-2)}
.dl-item.static{cursor:default}
.dl-item.static:hover{background:none}
.dl-item .dl-sub{grid-column:2;font-size:11.5px;color:var(--muted)}
.dbadge{font-size:10.5px;font-weight:600;border-radius:4px;padding:0 6px;color:var(--surface);white-space:nowrap}
.dbadge.added{background:var(--ok)} .dbadge.removed{background:var(--danger)} .dbadge.moved{background:var(--plat)} .dbadge.renamed,.dbadge.changed{background:var(--warn)}
.ip-close{display:none}
.swatches{display:flex;flex-wrap:wrap;gap:6px}
.sw{width:34px;height:26px;border-width:1.5px;border-style:solid;font:700 12px/1 var(--f-doc);cursor:pointer;padding:0}
.sw:hover{outline:2px solid var(--accent);outline-offset:1px}
.row3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.row3 label{display:grid;gap:3px;font-size:12px;color:var(--muted)}
.row3 input[type=color]{width:100%;height:30px;border:1px solid var(--line-strong);border-radius:6px;background:var(--surface);padding:2px;cursor:pointer}

/* empty state */
.empty-state{margin:auto;max-width:440px;text-align:center;padding:32px 16px;display:grid;gap:10px;justify-items:center}
.empty-state h2{font:600 20px/1.3 var(--f-display);margin:0}
.empty-state p{margin:0;color:var(--muted)}

/* modal */
#modal-root{position:relative;z-index:100}
.scrim{position:fixed;inset:0;background:var(--scrim);display:grid;place-items:center;z-index:100;padding:16px;padding-top:max(16px,env(safe-area-inset-top,0px));padding-bottom:max(16px,env(safe-area-inset-bottom,0px))}
.modal{background:var(--surface);color:var(--ink);border-radius:14px;width:min(560px,100%);max-height:100%;display:flex;flex-direction:column;box-shadow:var(--shadow);border:1px solid var(--line);min-width:0}
.modal.wide{width:min(960px,100%)}
.m-head{padding:18px 20px 6px;display:flex;align-items:start;justify-content:space-between;gap:12px}
.m-head h2{font:600 19px/1.3 var(--f-display);margin:0}
.m-body{padding:6px 20px 18px;overflow:auto;display:grid;gap:14px;min-height:0}
.m-body p{margin:0}
.m-foot{padding:12px 20px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:8px;flex-wrap:wrap}
.err{color:var(--danger);font-size:13px;background:var(--danger-weak);border-radius:8px;padding:8px 10px}
details.help{border:1px solid var(--line);border-radius:9px;padding:8px 12px;font-size:13px}
details.help summary{cursor:pointer;font-weight:500}
details.help ol,details.help ul{margin:8px 0 2px;padding-left:20px;display:grid;gap:4px}
.srcopts{display:grid;gap:6px}
.srcopt{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--line);border-radius:9px;padding:10px 12px;cursor:pointer}
.srcopt:has(input:checked){border-color:var(--accent);background:var(--accent-weak)}
.srcopt input{margin-top:4px;accent-color:var(--accent)}
.srcopt b{display:block;font-weight:600;font-size:13.5px}
.srcopt small{color:var(--muted);font-size:12.5px}
.srcopt select{margin-top:6px}
.imp{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:14px}
.imp-l{display:grid;gap:10px;align-content:start}
.imp-opts{display:grid;gap:6px}
.imp-r{display:grid;grid-template-rows:auto 1fr;gap:6px;min-width:0}
.imp-h{font-size:12px;color:var(--muted);font-weight:500;display:flex;justify-content:space-between;gap:8px}
.imp-prev{border:1px solid var(--line);border-radius:9px;background:var(--bg);padding:8px;overflow:auto;max-height:360px;min-height:200px;font-size:13px}
.ip-row{display:flex;align-items:center;gap:6px;padding:2px 0;padding-left:calc(var(--d) * 18px);white-space:nowrap}
.ip-row .tp{font-size:11px;color:var(--muted)}
.ip-row .ex{font-size:12px;color:var(--muted);overflow:hidden;text-overflow:ellipsis}
.warnlist{font-size:12.5px;color:var(--warn);margin:0;padding-left:18px}
.co-rows{display:grid;gap:8px}
.co-row{display:grid;grid-template-columns:64px 1fr 1fr;gap:8px;align-items:center}
.hist{display:grid;gap:2px}
.hist a,.hist div.h-item{display:grid;grid-template-columns:1fr auto;gap:2px 10px;padding:8px 10px;border-radius:8px;text-decoration:none;color:var(--ink);font-size:13px}
.hist a:hover{background:var(--surface-2)}
.hist .h-sub{font-size:12px;color:var(--muted)}
.hist .h-sha{font-family:var(--f-mono);font-size:12px;color:var(--accent-ink)}
.shortcuts{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:13px;margin:0}
.shortcuts dt{white-space:nowrap}
.shortcuts dd{margin:0;color:var(--ink-2)}
.guide{display:grid;gap:12px;font-size:13.5px}
.guide h3{font:600 14px/1.3 var(--f-display);margin:0 0 4px}
.guide ul{margin:0;padding-left:20px;display:grid;gap:3px}
.lifecycle{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:12.5px}

/* toasts */
#toasts{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);display:grid;gap:8px;z-index:300;width:min(520px,calc(100% - 32px));pointer-events:none}
.toast{pointer-events:auto;display:flex;align-items:center;gap:12px;background:var(--ink);color:var(--bg);border-radius:10px;padding:10px 14px;font-size:13.5px;box-shadow:var(--shadow)}
.toast.err{background:var(--danger);color:#fff}
.toast.ok::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--ok);flex:none}
.toast span{flex:1}
.toast button{border:0;background:none;color:inherit;font-weight:600;text-decoration:underline;cursor:pointer;padding:0}

@media (prefers-reduced-motion: no-preference){
  .rail,.insp{transition:transform .2s ease}
  .co-card,.vcard,.btn,.tbtn{transition:background-color .12s,border-color .12s,box-shadow .12s}
}

/* ---------- company pages: Workforce / Planning ---------- */
.pnav{display:flex;align-items:center;gap:2px;padding:0 12px;border-bottom:1px solid var(--line);background:var(--surface);overflow-x:auto;scrollbar-width:none}
.pnav::-webkit-scrollbar{display:none}
.pn{display:inline-flex;align-items:center;gap:7px;border:0;background:none;padding:10px 12px 9px;font-size:13.5px;font-weight:500;color:var(--muted);cursor:pointer;border-bottom:2px solid transparent;white-space:nowrap}
.pn svg{width:16px;height:16px}
.pn:hover{color:var(--ink)}
.pn[aria-current="page"]{color:var(--ink);border-bottom-color:var(--accent)}
.pn-meta{margin-left:auto;font-size:12px;color:var(--muted);white-space:nowrap;padding-left:12px}
.wf-page{flex:1;min-height:0;overflow:auto;padding:16px;display:flex;flex-direction:column;gap:14px;background:var(--bg)}
.wf-q{width:min(260px,40vw);margin-right:6px}
.tools .tab{white-space:nowrap}
.wf-alert{display:flex;align-items:center;gap:10px;flex-wrap:wrap;background:var(--warn-weak);border:1px solid color-mix(in srgb,var(--warn) 30%,transparent);border-radius:9px;padding:8px 12px;font-size:13px}
.wf-alert>svg{width:17px;height:17px;color:var(--warn);flex:none}
.wf-alert p{margin:0;flex:1;min-width:200px}
.crumbs{display:flex;flex-wrap:wrap;align-items:center;gap:2px;font-size:12.5px}
.crumb{border:0;background:none;padding:2px 6px;border-radius:5px;color:var(--accent-ink);cursor:pointer;max-width:260px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.crumb:hover{background:var(--surface-2)}
.crumb[aria-current="true"]{color:var(--ink);font-weight:600;cursor:default;background:none}
.crumb-sep{color:var(--muted)}
.wf-head{display:flex;flex-wrap:wrap;gap:14px 28px;align-items:flex-end;justify-content:space-between;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px 16px}
.wf-head h2{font:600 21px/1.25 var(--f-display);margin:0}
.wf-head .eyebrow{display:flex;align-items:center;gap:6px}
.wf-head p.muted{margin:2px 0 0;font-size:13px}
.wf-kpis{display:flex;flex-wrap:wrap;gap:8px;margin:0}
.wf-kpis>div{display:grid;gap:2px;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:7px 11px;min-width:96px}
.wf-head .wf-kpis>div{background:var(--bg)}
.wf-kpis dt{font-size:11.5px;color:var(--muted);order:2;line-height:1.3}
.wf-kpis dd{margin:0;font:600 19px/1.15 var(--f-display);font-variant-numeric:tabular-nums;order:1;white-space:nowrap}
.wf-kpis dd small{font:500 12px var(--f-body);color:var(--muted)}
.wf-kpis .short dd,.gap.short{color:var(--danger)}
.wf-kpis .over dd,.wf-kpis .warn dd,.gap.over{color:var(--warn)}
.wf-kpis .ok dd,.gap.ok{color:var(--ok)}
.wf-kpis .nop dd,.gap.nop{color:var(--plat)}
.wf-kpis .gap dd{font-size:16px}
.ws-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:6px}
.wf-subs,.wf-people,.pt-gone{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px;display:grid;gap:6px;min-width:0}
.wf-subs h3,.wf-people h3,.pt-gone h3{font:600 14px/1.3 var(--f-display);margin:0 0 4px;display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.wf-subs h3 .muted,.wf-people h3 .muted,.pt-gone h3 .muted{font:400 12.5px var(--f-body)}
.wf-own{margin:0 0 4px;font-size:12.5px;color:var(--muted)}
.wf-sub{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:3px 10px;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 10px;cursor:pointer;color:var(--ink);font-size:13px}
.wf-sub:hover{border-color:var(--accent);background:var(--accent-weak)}
.ws-name{display:flex;align-items:center;gap:7px;min-width:0;font-weight:500}
.ws-name>span:first-of-type{overflow:hidden;text-overflow:ellipsis}
.ws-num{white-space:nowrap;font-variant-numeric:tabular-nums}
.ws-bar{position:relative;height:6px;border-radius:3px;background:var(--surface-2);grid-column:1}
.ws-bar .a{position:absolute;left:0;top:0;bottom:0;border-radius:3px;background:var(--accent)}
.ws-bar .p{position:absolute;top:-3px;bottom:-3px;width:2px;margin-left:-1px;background:var(--ink-2)}
.ws-gap{font-size:12px;white-space:nowrap;justify-self:end}
.ws-gap.short{color:var(--danger)} .ws-gap.over{color:var(--warn)} .ws-gap.ok{color:var(--ok)} .ws-gap.nop{color:var(--plat)}
.pl-wrap{overflow-x:auto;margin:0 -12px;padding:0 12px}
.pl{width:100%;border-collapse:collapse;font-size:13px;min-width:760px}
.pl th{position:sticky;top:0;text-align:left;font-size:11.5px;font-weight:600;color:var(--muted);letter-spacing:.03em;padding:6px 8px;border-bottom:1px solid var(--line-strong);background:var(--surface);white-space:nowrap}
.pl td{padding:6px 8px;border-bottom:1px solid var(--line);vertical-align:top}
.pl td small{display:block;color:var(--muted);font-size:11.5px}
.pl tr:hover td{background:var(--bg)}
.pl .num,.pt .num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.pl td.unit{color:var(--ink-2);font-size:12.5px;min-width:160px}
.soon{color:var(--warn);font-weight:600}
.tag.head{border-color:var(--accent);color:var(--accent-ink);background:var(--accent-weak)}
.tag.new{border-color:var(--warn);color:var(--warn);background:var(--warn-weak)}
.pl-note{margin:4px 0 0;font-size:12px;color:var(--muted)}
.wf-gate{max-width:480px}
.gate-ic svg{width:34px;height:34px;color:var(--accent)}
.wf-unlock{display:grid;gap:8px;width:100%}
.wf-unlock-row{display:flex;gap:8px}
.wf-unlock-row .inp{flex:1}
.wf-gate-sm{display:grid;gap:6px}
.wf-gate-sm p{margin:0}
.bars{display:grid;gap:5px}
.bar{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr) 34px;gap:8px;align-items:center;font-size:12.5px}
.bl{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--ink-2)}
.bt{height:7px;border-radius:4px;background:var(--surface-2);overflow:hidden}
.bt i{display:block;height:100%;background:var(--accent);border-radius:4px}
.bn{text-align:right;font-variant-numeric:tabular-nums}
.pt{background:var(--surface);border:1px solid var(--line);border-radius:10px;overflow:auto;max-width:100%}

function N(type, name, o = {}, children = []) {
  return {

  return r;
}
function flatten(root) {
  const out = [];
  (function rec(n, depth, path, parent) {
    const p = path.concat(n.name);
    out.push({ n, depth, path: p, parent });
    n.children.forEach(c => rec(c, depth + 1, p, n));
  })(root, 0, [], null);
  return out;
}
const byName = (root, name) => flatten(root).find(x => x.n.name === name)?.n;
function isDescendant(node, id) { let hit = false; walk(node, n => { if (n.id === id) hit = true; }); return hit; }

    n.children.forEach(c => { t += rec(c); });
    m.set(n.id, t);
    return t;
  })(root);
  return m;
}

  let units = 0, hc = 0, ai = 0, partners = 0, subs = 0, bu = 0, layers = 0;
  const spans = [], byType = {};
  (function rec(n, d) {
    byType[n.type] = (byType[n.type] || 0) + 1;
    if (n.type === 'ai') ai++;
    else if (n.type === 'partner') partners++;
    else if (n.type === 'company') subs++;
    else { units++; hc += +n.hc || 0; layers = Math.max(layers, d + 1); if (n.type === 'line') bu++; }
    const line = n.children.filter(c => !c.staff && !EXTERNAL.has(c.type));
    if (line.length) spans.push(line.length);
    n.children.forEach(c => rec(c, d + (EXTERNAL.has(c.type) ? 0 : 1)));
  })(root, 0);

function fixNode(n) {

  ['nameEn', 'code', 'title', 'head', 'note'].forEach(k => { n[k] = n[k] == null ? '' : String(n[k]); });
  n.hc = Math.max(0, parseInt(n.hc, 10) || 0);
  n.staff = !!n.staff;
  if (!['auto', 'h', 'v'].includes(n.layout)) n.layout = 'auto';

  const W = Math.max(maxR + PAD, 1100);
  const titleLines = String(doc.title || '').split('\n').map(t => t.trim()).filter(Boolean);
  const legendLines = String(doc.legend || '').split('\n').filter(t => t.trim());
  const cells = (doc.footer || []).filter(c => c && c.length);
  const fr = { title: null, legend: null, footer: null };
  if (titleLines.length) fr.title = Object.assign({}, okBox(fb.title) ? fb.title : { x: 16, y: 16, w: W - 32, h: 49 + titleLines.length * 40 }, { lines: titleLines, color: okColor(doc.titleColor) || '#FF0000', fs: px(doc.titleSize, 30) });
  let y = maxB + 40;
  if (legendLines.length) {
    const b = okBox(fb.legend) ? fb.legend : { x: PAD, y, w: Math.min(W - PAD * 2, 40 + Math.max(...legendLines.map(t => t.length)) * 8.6), h: 22 + legendLines.length * 22.4 };
    fr.legend = Object.assign({}, b, { lines: legendLines, fs: px(doc.legendSize, 16) });

  if (cells.length) {
    const fs = px(doc.footerSize, 13);

      : cells.map((c, i) => ({ x: PAD + i * (W - PAD * 2) / cells.length, y, w: (W - PAD * 2) / cells.length, h: 24 + Math.max(...cells.map(q => q.length)) * 20 }));
    fr.footer = { cells, boxes, fs };

}

/* ============================================================
   Diff between two versions (units are matched by id; drafts copied
   from another version keep their unit ids)
   ============================================================ */
function indexTree(root) {
  const m = new Map();
  flatten(root).forEach(x => m.set(x.n.id, { node: x.n, parentId: x.parent ? x.parent.id : null, parentName: x.parent ? x.parent.name : '', path: x.path }));
  return m;
}
function diffVersions(a, b) {
  const ma = indexTree(a.root), mb = indexTree(b.root);
  const out = { added: [], removed: [], moved: [], renamed: [], changed: [], map: {} };
  const norm = (n, f) => f === 'staff' ? String(!!n[f]) : f === 'hc' ? String(+n[f] || 0) : String(n[f] ?? '');
  for (const [id, x] of mb) {
    const y = ma.get(id);
    if (!y) { out.added.push(x); out.map[id] = 'added'; continue; }
    const tags = [];
    if (y.parentId !== x.parentId) { out.moved.push({ from: y, to: x }); tags.push('moved'); }
    if (y.node.name !== x.node.name) { out.renamed.push({ from: y, to: x }); tags.push('renamed'); }
    const fields = ['type', 'title', 'head', 'hc', 'code', 'staff', 'nameEn'].filter(f => norm(y.node, f) !== norm(x.node, f));
    if (fields.length) { out.changed.push({ from: y, to: x, fields }); tags.push('changed'); }
    if (tags.length) out.map[id] = tags[0];
  }
  for (const [id, y] of ma) if (!mb.has(id)) out.removed.push(y);
  return out;
}

function copyLook(c, from) {

}

  const f = find(v.root, id || S.selected || v.root.id);

  const type = o.type || (o.staff ? 'office' : TYPES[f.node.type].child);
  const c = childLook(N(type, TYPES[type].nn, { staff: !!o.staff }), f.node);

});

  return mutate('เพิ่มหน่วยงาน', v2 => {

/* ---------- version lifecycle ---------- */
function createDraft(code, src, name) {
  let root, basedOn = null, model = 'industrial';
  const base = byId(src);
  if (base) { root = clone(base.root); basedOn = base.id; model = base.model; }
  else if (src === 'tpl:functional') root = tplFunctional(1);
  else if (src === 'tpl:platform') { root = tplPlatform(); model = 'platform'; }
  else root = tplBlank();
  const co = company(code) || { code };
  const frameFrom = (base && base.doc) || (activeOf(code) && activeOf(code).doc);
  const doc = frameFrom ? clone(frameFrom) : {
    title: `${(co.nameEn || co.nameTh || code).toUpperCase()}${co.nameEn ? ` (${code})` : ''} ${new Date().getFullYear() + 1}`,
    titleColor: '#FF0000', footer: [], legend: '',
  };
  const v = {
    id: uid('v'), companyCode: code, versionNo: nextNo(code), name, status: 'draft', model,
    effectiveDate: null, endDate: null, plannedDate: '', note: '', approvalRef: '', basedOn,
    createdAt: nowISO(), createdBy: who(), updatedAt: nowISO(), updatedBy: who(), doc, root,
    layout: base && isFree(base) ? 'free' : 'auto',
  };
  if (base && base.fontScale) v.fontScale = base.fontScale;
  ensureBoxes(v);
  S.data.versions.push(v);
  markDirty(`${code}: สร้าง Draft v${v.versionNo} “${name}”`);
  openVersion(v.id);
  toast(`สร้าง Draft v${v.versionNo} แล้ว — แก้ไขบนแผนผังได้ทันที`, 'ok');
}
function publish(v, date, ref) {
  const act = activeOf(v.companyCode);
  if (act) { act.status = 'inactive'; act.endDate = dayBefore(date); act.retiredAt = nowISO(); act.retiredBy = who(); }
  Object.assign(v, { status: 'active', effectiveDate: date, endDate: null, publishedAt: nowISO(), publishedBy: who(), approvalRef: ref || '' });
  markDirty(`${v.companyCode}: Publish v${v.versionNo} “${v.name}” มีผล ${date}`);
  S.undo = []; S.redo = []; S.compareWith = null;
  refresh();
  toast(S.user ? `v${v.versionNo} เป็น Active แล้ว — กด “บันทึก” เพื่อขึ้น GitHub` : `v${v.versionNo} เป็น Active แล้ว`, 'ok');
}

  S.versionId = vid; S.selected = null; S.compareWith = null; S.undo = []; S.redo = []; S.esKey = null;
  S.ui.rail = false; S.ui.insp = false;

}

function setRoute(raw) {
  let [code, page] = String(raw || '').split('/');
  S.page = PAGES.some(p => p[0] === page) ? page : 'structure';
  if (code && !company(code) && company(RENAMED_CODES[code])) {

function thumbSVG(v) {
  const L = isFree(v) ? freeLayout(v, new Set()) : layoutTree(v.root, new Set());
  let x0 = Infinity, y0 = Infinity, x1 = -Infinity, y1 = -Infinity;
  L.nodes.forEach(it => { x0 = Math.min(x0, it.x); y0 = Math.min(y0, it.y); x1 = Math.max(x1, it.x + it.w); y1 = Math.max(y1, it.y + it.h); });
  const links = L.links.map(l => `<path d="${l.d}" stroke="${l.color}"/>`).join('');
  const rects = L.nodes.map(it => { const st = styleOf(it.n); return `<rect x="${it.x}" y="${it.y}" width="${it.w}" height="${it.h}" fill="${st.fill || '#FFFFFF'}" stroke="${st.line || st.fill || '#000000'}"/>`; }).join('');
  return `<svg class="thumb" viewBox="${x0 - 20} ${y0 - 20} ${x1 - x0 + 40} ${y1 - y0 + 40}" preserveAspectRatio="xMidYMid meet" aria-hidden="true"><g class="tl">${links}</g>${rects}</svg>`;
}
function homeHTML() {

      <span class="cc-name">${esc(c.nameTh || c.nameEn || 'ยังไม่ได้ระบุชื่อบริษัท')}</span>

      <dl class="cc-stats"><div><dt>หน่วยงาน</dt><dd>${s ? fmtNum(s.units) : '—'}</dd></div><div><dt>หน่วยธุรกิจ</dt><dd>${s && s.bu ? s.bu : '—'}</dd></div><div><dt>ชั้นบังคับบัญชา</dt><dd>${s ? s.layers : '—'}</dd></div></dl>
      <span class="cc-foot">${a ? `มีผล ${fmtDate(a.effectiveDate)}` : ''}${s && s.hc ? `<span>แผน ${fmtNum(s.hc)} คน</span>` : ''}${S.wf ? `<span>พนักงาน ${fmtNum(S.wf.people.filter(p => p.co === c.code).length)} คน</span>` : ''}${s && s.subs ? `<span>บริษัทในเครือ ${s.subs}</span>` : ''}${model ? `<span class="pill model">${model.en}</span>` : ''}${nd ? `<span class="pill draft">Draft ${nd}</span>` : ''}${ni ? `<span class="pill inactive">เก่า ${ni}</span>` : ''}</span>

  return `<main class="home" id="body"><div id="banner">${bannerHTML()}</div>

function openModal(o) {
  const wrap = document.createElement('div');
  wrap.className = 'scrim';
  const tid = uid('mt');
  wrap.innerHTML = `<div class="modal${o.wide ? ' wide' : ''}" role="dialog" aria-modal="true" aria-labelledby="${tid}">
    <div class="m-head"><h2 id="${tid}">${esc(o.title)}</h2><button class="ibtn" data-m="x" aria-label="ปิด">${I.close}</button></div>
    <div class="m-body">${o.body}</div>
    ${o.foot && o.foot.length ? `<div class="m-foot">${o.foot.map((b, i) => `<button class="btn ${b.cls || ''}" data-mi="${i}" ${b.id ? `id="${b.id}"` : ''}>${b.label}</button>`).join('')}</div>` : ''}
  </div>`;
  $('#modal-root').appendChild(wrap);
  const prev = document.activeElement;
  const onKey = e => { if (e.key === 'Escape') { e.stopPropagation(); close(); } };
  function close() { wrap.remove(); document.removeEventListener('keydown', onKey, true); if (prev && prev.focus) prev.focus({ preventScroll: true }); }
  document.addEventListener('keydown', onKey, true);
  let downOnScrim = false;
  wrap.addEventListener('pointerdown', e => { downOnScrim = e.target === wrap; });
  wrap.addEventListener('click', e => {
    if ((e.target === wrap && downOnScrim) || e.target.closest('[data-m="x"]')) { close(); return; }
    const b = e.target.closest('[data-mi]');
    if (b && !b.disabled) o.foot[+b.dataset.mi].onClick?.(close, wrap, b);
  });
  if (o.onMount) o.onMount(wrap, close);
  setTimeout(() => { const el = wrap.querySelector('[autofocus]') || wrap.querySelector('.m-body input, .m-body textarea, .m-foot .primary'); if (el) el.focus(); }, 0);
  return close;
}
function toast(msg, kind = 'info', action = null, ms = 4200) {
  const el = document.createElement('div');
  el.className = 'toast ' + kind;
  el.innerHTML = `<span>${esc(msg)}</span>${action ? `<button>${esc(action.label)}</button>` : ''}`;
  if (action) el.querySelector('button').addEventListener('click', () => { action.fn(); el.remove(); });
  $('#toasts').appendChild(el);
  setTimeout(() => el.remove(), action ? Math.max(ms, 6500) : ms);
}

const BY_LEVEL = ['board', 'executive', 'division', 'department', 'section', 'team'];
function guessType(name, lv) { for (const [re, t] of GUESS) if (re.test(name)) return t; return BY_LEVEL[Math.min(lv, BY_LEVEL.length - 1)]; }
function parseOutline(text) {
  const lines = String(text || '').replace(/\r\n?/g, '\n').split('\n');
  const filled = lines.filter(l => l.trim());
  const tabular = filled.length > 0 && filled.every(l => /^\s*\d+\t/.test(l));
  const rows = [], warnings = [], stack = [];
  lines.forEach((line, i) => {
    if (!line.trim()) return;
    let level, rest, cols = null;
    if (tabular) {
      cols = line.split('\t').map(s => s.trim());
      level = Math.max(1, parseInt(cols[0], 10) || 1) - 1;
      rest = cols[1] || '';
    } else {
      const lead = line.match(/^[ \t 　]*/)[0];
      const width = [...lead].reduce((w, c) => w + (c === '\t' ? 4 : 1), 0);
      let body = line.slice(lead.length).replace(/^[-*•·▪◦‣–—>]+\s*/, '');
      const num = body.match(/^(\d+(?:\.\d+)*)[.)]?\s+/);
      if (num) { level = num[1].split('.').length - 1; body = body.slice(num[0].length); }
      else {
        while (stack.length && stack[stack.length - 1] > width) stack.pop();
        if (!stack.length || stack[stack.length - 1] < width) stack.push(width);
        level = stack.length - 1;
      }
      rest = body;
    }
    let staff = false, type = null;
    rest = rest.replace(/\s*[([]\s*(staff|ขึ้นตรง|สตาฟ)\s*[)\]]/i, () => { staff = true; return ''; });
    if (/\s\*\s*$/.test(rest)) { staff = true; rest = rest.replace(/\s\*\s*$/, ''); }
    rest = rest.replace(/\[([^\]]+)\]/, (m0, t) => { const k = typeFromLabel(t); if (k) { type = k; return ''; } return m0; });
    const parts = rest.split('|').map(s => s.trim());
    const r = { level, name: parts[0], type, title: parts[1] || '', head: parts[2] || '', hc: parseInt(parts[3], 10) || 0, staff, line: i + 1 };
    if (cols) { r.type = typeFromLabel(cols[2]) || r.type; r.title = cols[3] || r.title; r.head = cols[4] || r.head; r.hc = parseInt(cols[5], 10) || r.hc; }
    if (r.name) rows.push(r);
  });
  const tops = [], path = [];
  let prev = -1;
  rows.forEach(r => {
    let lv = r.level;
    if (lv > prev + 1) { warnings.push(`บรรทัด ${r.line}: ข้ามระดับ ปรับเป็นระดับถัดไปให้อัตโนมัติ`); lv = prev + 1; }
    const type = r.type || guessType(r.name, lv);
    const staff = r.staff || (lv > 0 && (type === 'committee' || /ตรวจสอบภายใน|เลขานุการ|ที่ปรึกษา|internal audit|secretary/i.test(r.name)));
    const node = N(type, r.name, { title: r.title, head: r.head, hc: r.hc, staff });
    path.length = lv;
    if (lv === 0) tops.push(node); else path[lv - 1].children.push(node);
    path[lv] = node;
    prev = lv;
  });
  return { tops, count: rows.length, warnings };
}

          if (mode === 'replace') {
            if (isFree(v2)) unfreezeLayout(v2);   // a fresh structure starts from the automatic layout
            if (res.tops.length === 1) v2.root = res.tops[0]; else v2.root.children = res.tops;
            S.collapsed[v2.id] = new Set();
            S.levelSel[v2.id] = '';
            S.views[v2.id] = null;
            return undefined;
          }

        });

      } },

        const res = parseOutline(ta.value);
        go.disabled = !res.count;
        cnt.textContent = res.count ? `${res.count} หน่วยงาน` : '';
        if (!res.count) { prev.innerHTML = '<p class="muted" style="margin:0">วางข้อความทางซ้ายเพื่อดูตัวอย่าง</p>'; return; }
        const mode = el.querySelector('input[name="imp-mode"]:checked').value;
        const flat = res.tops.flatMap(t => flatten(t));
        let note = '';
        if (mode === 'replace' && res.tops.length > 1) note = `<p class="warnlist" style="padding:0 0 6px">พบหน่วยระดับบนสุด ${res.tops.length} หน่วย จะวางไว้ใต้ “${esc(v.root.name)}”</p>`;
        prev.innerHTML = note + flat.map(x => `<div class="ip-row" style="--d:${x.depth}"><i class="dot tc-${x.n.type}"></i><span>${esc(x.n.name)}</span><span class="tp">${esc(TYPES[x.n.type].th)}${x.n.staff ? ' · Staff' : ''}</span>${x.n.title || x.n.hc ? `<span class="ex">${esc([x.n.title, x.n.hc ? x.n.hc + ' คน' : ''].filter(Boolean).join(' · '))}</span>` : ''}</div>`).join('') +
          (res.warnings.length ? `<ul class="warnlist">${res.warnings.slice(0, 5).map(w => `<li>${esc(w)}</li>`).join('')}</ul>` : '');
      };
      ta.addEventListener('input', upd);
      el.querySelectorAll('input[name="imp-mode"]').forEach(r => r.addEventListener('change', upd));
      ta.addEventListener('keydown', e => {
        if (e.key === 'Tab') { e.preventDefault(); const s = ta.selectionStart; ta.setRangeText('\t', s, ta.selectionEnd, 'end'); upd(); }
      });
      el.querySelector('#imp-sample').addEventListener('click', () => { ta.value = IMPORT_SAMPLE; upd(); ta.focus(); });
      go.disabled = true;
    },
  });
}

const GH = 'https://api.github.com';
const repoPath = () => `/repos/${encodeURIComponent(S.cfg.owner)}/${encodeURIComponent(S.cfg.repo)}`;
const contentPath = () => `${repoPath()}/contents/${S.cfg.path.split('/').map(encodeURIComponent).join('/')}`;
async function gh(path, opts = {}, token = S.token) {
  const headers = Object.assign({ Accept: 'application/vnd.github+json', 'X-GitHub-Api-Version': '2022-11-28' }, opts.headers || {});
  if (token) headers.Authorization = 'Bearer ' + token;
  const init = { method: opts.method || 'GET', headers, cache: 'no-store' };
  if (opts.body) { headers['Content-Type'] = 'application/json'; init.body = JSON.stringify(opts.body); }
  let res;
  try { res = await fetch(GH + path, init); }
  catch (e) { const err = new Error('เชื่อมต่อ GitHub ไม่ได้ ตรวจสอบอินเทอร์เน็ตแล้วลองอีกครั้ง'); err.network = true; throw err; }
  if (!res.ok) {
    let msg = '';
    try { msg = (await res.json()).message || ''; } catch (e) { /* not json */ }
    const err = new Error(msg || 'HTTP ' + res.status);
    err.status = res.status;
    throw err;
  }
  if (res.status === 204) return null;
  const ct = res.headers.get('content-type') || '';
  return ct.includes('json') ? res.json() : res.text();
}
async function ghVerify(token) {

  let repo;
  try { repo = await gh(repoPath(), {}, token); }
  catch (e) { if (e.status === 404 || e.status === 403) throw new Error(`ไม่พบ ${S.cfg.owner}/${S.cfg.repo} หรือ Token นี้ไม่ได้รับสิทธิ์เข้าถึง repository นี้`); throw e; }

async function ghLoad(token = S.token) {

// Three-way merge at version level. Versions (and company records) changed in this browser since the

function mergeData(base, local, remote) {

  const list = (field, id, label) => {
    const B = new Map(((base && base[field]) || []).map(x => [id(x), x]));
    const L = new Map(local[field].map(x => [id(x), x]));
    const R = new Map(remote[field].map(x => [id(x), x]));
    const res = [];
    for (const k of [...R.keys(), ...[...L.keys()].filter(k => !R.has(k))]) {
      const b = B.get(k), l = L.get(k), r = R.get(k);
      let take;
      if (base) {
        const lChanged = key(l) !== key(b), rChanged = key(r) !== key(b);
        if (lChanged && rChanged && key(l) !== key(r)) clashes.push(label(l || r));
        take = lChanged ? (l || (rChanged ? r : null)) : r;   // deleted here but edited there: keep theirs
      } else {
        // no record of the last load (older browser data): keep both sides, the newer edit wins
        take = !r ? l : !l ? r : (String(l.updatedAt || '') > String(r.updatedAt || '') ? l : r);
      }
      if (take) res.push(clone(take));
    }
    out[field] = res;

  list('versions', v => v.id, v => `${v.companyCode} v${v.versionNo} “${v.name}”`);

  const byCo = {};
  out.versions.filter(v => v.status === 'active').forEach(v => (byCo[v.companyCode] = byCo[v.companyCode] || []).push(v));

    a.sort((x, y) => String(y.publishedAt || y.effectiveDate || '').localeCompare(String(x.publishedAt || x.effectiveDate || '')));

async function unzip(buf) {

  if (eocd < 0) throw new Error('ไฟล์นี้ไม่ใช่ไฟล์ Excel (.xlsx)');
  const files = {};
  let p = dv.getUint32(eocd + 16, true);
  for (let i = 0, n = dv.getUint16(eocd + 10, true); i < n && dv.getUint32(p, true) === 0x02014b50; i++) {
    const nl = dv.getUint16(p + 28, true);
    files[dec.decode(u8.subarray(p + 46, p + 46 + nl))] = { method: dv.getUint16(p + 10, true), size: dv.getUint32(p + 20, true), off: dv.getUint32(p + 42, true) };
    p += 46 + nl + dv.getUint16(p + 30, true) + dv.getUint16(p + 32, true);
  }
  return async name => {
    const f = files[name];
    if (!f) return null;
    const start = f.off + 30 + dv.getUint16(f.off + 26, true) + dv.getUint16(f.off + 28, true);
    const raw = u8.subarray(start, start + f.size);
    return dec.decode(f.method === 8 ? await pipeBytes(raw, new DecompressionStream('deflate-raw')) : raw);
  };

  let head, subs = '';

  const sm = wfSummary(list);
  if (out) {
    head = `<div class="wf-head"><div><p class="eyebrow">ยังไม่ได้จัดลงกล่อง</p><h2>${fmtNum(list.length)} คน</h2></div></div>`;

      ${kpiHTML([
        ['คนจริง' + (S.wfScope === 'all' ? ' (รวมหน่วยย่อย)' : ''), fmtNum(act)],
        ['อัตรากำลังตามแผน', pl ? fmtNum(pl) : '—'],
        ['ส่วนต่าง', g.txt || '—', 'gap ' + g.cls],
        ['พนักงานประจำ', act ? `${fmtNum(sm.perm)} <small>/ สัญญาจ้าง ${fmtNum(act - sm.perm)}</small>` : '—'],
        ['เกษียณภายใน 3 ปี', fmtNum(sm.retire), sm.retire ? 'warn' : '', `เกษียณภายในสิ้นปี ${new Date().getFullYear() + 3}`],
        ['อายุงานเฉลี่ย', sm.svcN ? fmtYears(sm.svc / sm.svcN) : '—'],

    const kids = node.children.filter(c => !EXTERNAL.has(c.type));
    if (kids.length) {

      const own = (P.byNode.get(node.id) || []).length;
      subs = `<section class="wf-subs"><h3>หน่วยงานภายใต้ <span class="muted">${kids.length} หน่วย</span></h3>
        ${own ? `<p class="wf-own">อยู่ที่ระดับหน่วยนี้โดยตรง <b>${fmtNum(own)}</b> คน</p>` : ''}
        <div class="ws-list">${kids.map(c => {

function wfFilter(list) {

  return list.filter(p => [p.id, wfName(p), wfNameEn(p), p.pos, p.lvl, p.edu, p.deg, p.major, p.school].some(x => String(x || '').toLowerCase().includes(q)));
}
function peopleCount(list) { const n = wfFilter(list).length; return `${fmtNum(n)} คน${n !== list.length ? ` จาก ${fmtNum(list.length)}` : ''}`; }
function wfPeopleHTML(v, P, list, out) {

    ${rows.map(p => `<tr${P.headSet.has(p) ? ' class="is-head"' : ''}><td class="mono">${esc(p.id)}</td><td><b>${esc(wfName(p))}</b>${P.headSet.has(p) ? ' <span class="tag head">หัวหน้าหน่วย</span>' : ''}${wfNameEn(p) ? `<small>${esc(wfNameEn(p))}</small>` : ''}</td>
      <td>${esc(p.pos)}<small>${esc(p.grp)}</small></td><td class="mono">${esc(p.lvl)}</td><td class="edu">${esc(p.edu || '—')}${p.deg || p.major ? `<small>${esc([p.deg !== p.edu ? p.deg : '', p.major].filter(Boolean).join(' · '))}</small>` : ''}${p.school ? `<small>${esc(p.school)}</small>` : ''}</td><td>${p.emp === 'ประจำ' ? 'ประจำ' : `<span class="tag">${esc(p.emp)}</span>`}</td>

    </tbody></table></div>${rows.some(p => p.retire && p.retire <= year + 3) ? '<p class="pl-note">ปีที่เกษียณเป็น พ.ศ. · ตัวเลขสีส้ม = เกษียณภายใน 3 ปี</p>' : ''}`;
}
function wfRefreshPeople() {
  const v = curVersion();
  if (!v || !S.wf) return;
  const cards = $('#wfp-list');
  if (cards) {
    const P = wfPlace(v), { out, list, node } = wfListOf(v, P);
    cards.innerHTML = wfCardsHTML(v, P, list, out, node);

  }
  const box = $('#wf-people');
  if (!box) return;
  const P = wfPlace(v), cur = wfCurId(v), out = cur === '__out';
  const node = out ? null : find(v.root, cur).node;

  box.innerHTML = wfPeopleHTML(v, P, list, out);

}

function personHTML(p, P, unit) {

function wfCardsHTML(v, P, list, out, node) {
  const rows = wfFilter(list);
  if (!rows.length) return `<p class="empty">${list.length ? 'ไม่พบรายชื่อที่ตรงกับคำค้น' : 'ยังไม่มีพนักงานในหน่วยนี้'}</p>`;

      const r = P.unitTo.get(p.unit), was = r && r.was && P.act ? find(P.act.root, r.was) : null;

  if (S.wfScope !== 'all' || !node) return sortPeople(rows, P).map(p => personHTML(p, P)).join('');

function wfSelect(id, o = {}) {

    else if (S.ui.hideInsp) togglePanel('insp');
  }

// drill down: frame the clicked unit and everything under it
function wfZoomTo(id) {
  const cv = $('#canvas'), st = $('#stage'), L = S.layout, v = curVersion();
  if (!cv || !L || !v) return;
  const f = id && id !== '__out' && find(v.root, id);
  if (!f || f.node === v.root) { glide(st); fitView(); return; }
  const ids = new Set();
  walk(f.node, n => ids.add(n.id));
  let x0 = Infinity, y0 = Infinity, x1 = -Infinity, y1 = -Infinity;
  L.nodes.forEach(it => { if (ids.has(it.n.id)) { x0 = Math.min(x0, it.x); y0 = Math.min(y0, it.y); x1 = Math.max(x1, it.x + it.w); y1 = Math.max(y1, it.y + it.h); } });
  if (!isFinite(x0)) return;
  const r = cv.getBoundingClientRect(), pad = 48;
  const z = clamp(Math.min((r.width - pad * 2) / (x1 - x0), (r.height - pad * 2) / (y1 - y0)), 0.15, 1);
  S.views[viewKey()] = { z, x: (r.width - (x1 - x0) * z) / 2 - x0 * z, y: Math.max(pad, (r.height - (y1 - y0) * z) / 2) - y0 * z };
  glide(st);
  applyView();
}
function glide(st) { if (!st) return; st.classList.add('glide'); clearTimeout(glide.t); glide.t = setTimeout(() => st.classList.remove('glide'), 420); }

function wrapText(ctx, text, maxW, maxLines) {

    [...seg.segment(tok)].forEach(x => tokens.push(x.segment));

  for (const w of tokens) {
    const cur = lines[lines.length - 1];
    if (!cur || ctx.measureText(cur + w).width <= maxW) { lines[lines.length - 1] = cur + w; continue; }
    if (lines.length === maxLines) { truncated = true; break; }
    lines.push(w.trimStart());
  }
  let last = lines[lines.length - 1];
  if (truncated || ctx.measureText(last).width > maxW) {

    lines[lines.length - 1] = last.trimEnd() + '…';

  const t = e.target;
  if (/^(INPUT|TEXTAREA|SELECT)$/.test(t.tagName) || t.isContentEditable) return;
  if (S.route.view !== 'co') return;
  if ((e.key === '[' || e.key === ']') && !mod && !e.altKey && !isNarrow()) { e.preventDefault(); togglePanel(e.key === '[' ? 'rail' : 'insp'); return; }
  const v = curVersion();
  if (!v) return;
  if (mod && k === 'z') { e.preventDefault(); if (e.shiftKey) redo(); else undo(); return; }
  if (mod && k === 'y') { e.preventDefault(); redo(); return; }
  if (S.page !== 'structure') return;
  if (e.key === 'Escape' && S.selected) { selectNode(null); return; }
  const f = S.selected ? find(v.root, S.selected) : null;
  if (!f) return;
  if (e.key.startsWith('Arrow') && !mod && !e.altKey && isFree(v) && canEdit(v) && okBox(f.node.box) && S.tab === 'chart') {
    e.preventDefault();
    const step = e.shiftKey ? 10 : 1;
    beginEdit(v, v.id + 'nudge' + f.node.id);
    f.node.box.x += e.key === 'ArrowLeft' ? -step : e.key === 'ArrowRight' ? step : 0;
    f.node.box.y += e.key === 'ArrowUp' ? -step : e.key === 'ArrowDown' ? step : 0;

    setHTML('#insp', inspHTML(v));

  }
  if (e.key.startsWith('Arrow') && !mod) {

    else if (e.key === 'ArrowDown' && f.node.children.length && !colSet(v.id).has(f.node.id)) next = f.node.children[0].id;
    else if (e.key === 'ArrowLeft' && f.parent && f.index > 0) next = f.parent.children[f.index - 1].id;

  else if (e.key === 'Enter') { e.preventDefault(); const id = opAddSibling(f.node.id); if (id) afterAdd(id); }

async function boot() {

  if (theme === 'light' || theme === 'dark') document.documentElement.dataset.theme = theme;
  try { const p = JSON.parse(sGet(LS_PANELS) || 'null'); if (p) { S.ui.hideRail = !!p.rail; S.ui.hideInsp = !!p.insp; } } catch (e) { /* ignore bad setting */ }

  try {
    const local = JSON.parse(sGet(LS_DATA) || 'null');
    if (local && local.data) {
      S.data = migrate(local.data);
      S.base = local.dirty ? (local.base ? migrate(local.base) : null) : clone(S.data);
      S.sha = local.sha || null;
      S.dirty = !!local.dirty;
      S.changes = Array.isArray(local.changes) ? local.changes : [];
      S.source = local.source || 'local';
    }
  } catch (e) { S.data = null; }
  if (!S.data) { S.data = freshData(); S.sha = null; S.dirty = false; S.changes = []; }
  try {
    const w = JSON.parse(sGet(LS_WF) || 'null');
    if (w && w.env) { S.wfEnv = w.env; S.wfSha = w.sha || null; S.wfDirty = !!w.dirty; S.wfChanges = Array.isArray(w.changes) ? w.changes : []; }
  } catch (e) { /* ignore a bad cache */ }
  S.demo = isStarter() || S.dirty;
  setRoute(decodeURIComponent(location.hash.slice(1)));
  render();
  const token = sGet(LS_TOKEN, 's') || sGet(LS_TOKEN, 'l');
  if (token) await doLogin(token, !!sGet(LS_TOKEN, 'l'), true);
  else { await loadPublic(); wfSync(); }
}
boot();

// a tab left open keeps running the code it loaded; tell it when a newer app is published so nobody saves with old code
let appTag = null;
async function checkAppUpdate() {
  if (!/^https?:$/.test(location.protocol) || document.hidden || S.appStale) return;
  try {
    const r = await fetch(location.pathname, { method: 'HEAD', cache: 'no-store' });
    const tag = r.ok && (r.headers.get('etag') || r.headers.get('last-modified'));
    if (!tag) return;
    if (appTag === null) { appTag = tag; return; }
    if (tag !== appTag) { S.appStale = true; setHTML('#banner', bannerHTML()); toast('มีแอปเวอร์ชันใหม่ — กดรีเฟรชก่อนบันทึก', 'info', { label: 'รีเฟรช', fn: A.reload }, 10000); }
  } catch (e) { /* offline */ }
}
checkAppUpdate();
setInterval(checkAppUpdate, 5 * 60 * 1000);
window.addEventListener('focus', checkAppUpdate);
})();
</script>
